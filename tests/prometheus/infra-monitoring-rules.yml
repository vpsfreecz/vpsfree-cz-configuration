            value: 1
          - labels: 'ALERTS{alertname="HypervisorCritOsCpuLoad",alertstate="firing",alertclass="cpuload",alias="prg-95",fqdn="prg-95.example",instance="prg-95:9100",severity="critical"}'
            value: 1

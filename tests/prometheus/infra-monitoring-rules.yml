rule_files:
  - @ruleFile@
evaluation_interval: 20s

tests:
  - name: Staging and playground CPU usage keep their real location and wait fifty minutes
    interval: 20s
    input_series:
      - series: 'node_cpu_seconds_total{alias="stg-85",fqdn="stg-85.example",instance="stg-85:9100",job="nodes",role="hypervisor",os="vpsadminos",location="stg",cpu="0",mode="idle"}'
        values: '0+4x151'
      - series: 'node_cpu_seconds_total{alias="stg-85",fqdn="stg-85.example",instance="stg-85:9100",job="nodes",role="hypervisor",os="vpsadminos",location="stg",cpu="1",mode="idle"}'
        values: '0+2x151'
      - series: 'node_boot_time_seconds{alias="stg-85",fqdn="stg-85.example",instance="stg-85:9100",job="nodes",role="hypervisor",os="vpsadminos",location="stg"}'
        values: '-7200+0x151'
      - series: 'node_cpu_seconds_total{alias="stg-95",fqdn="stg-95.example",instance="stg-95:9100",job="nodes",role="hypervisor",os="vpsadminos",location="stg",cpu="0",mode="idle"}'
        values: '0+1x151'

        values: '-7200+0x151'
      - series: 'node_cpu_seconds_total{alias="stg-other",fqdn="stg-other.example",instance="stg-other:9100",job="nodes",role="hypervisor",os="nixos",location="stg",cpu="0",mode="idle"}'
        values: '0+1x151'
      - series: 'node_boot_time_seconds{alias="stg-other",fqdn="stg-other.example",instance="stg-other:9100",job="nodes",role="hypervisor",os="nixos",location="stg"}'
        values: '-7200+0x151'
      - series: 'node_cpu_seconds_total{alias="pgnd-85",fqdn="pgnd-85.example",instance="pgnd-85:9100",job="nodes",role="hypervisor",os="vpsadminos",location="pgnd",cpu="0",mode="idle"}'
        values: '0+4x151'

rule_files:
- @ruleFile@
evaluation_interval: 1m
tests:
- name: The shared boot signal lasts for 30 minutes
  interval: 1m
  input_series:
  - series: node_boot_time_seconds{alias="node1",fqdn="node1.example",role="hypervisor"}
    values: 0+0x31
  promql_expr_test:
  - expr: vpsfree_hypervisor_booting{fqdn="node1.example"}
    eval_time: 29m40s
    exp_samples:
    - labels: vpsfree_hypervisor_booting{alias="node1",fqdn="node1.example",role="hypervisor"}
      value: 1
  - expr: vpsfree_hypervisor_booting{fqdn="node1.example"}
    eval_time: 30m
    exp_samples:
    - labels: vpsfree_hypervisor_booting{alias="node1",fqdn="node1.example",role="hypervisor"}
      value: 0
  - expr: vpsfree_hypervisor_booting{fqdn="old-node.example"}
    eval_time: 30m
    exp_samples: []
- name: Unsatisfied VPS alerts retain identity and converge independently
  interval: 1m
  input_series:
  - series: node_boot_time_seconds{alias="node1",fqdn="node1.example",role="hypervisor"}
    values: 0+0x60
  - series: nodectld_vps_boot_autostart_check_success{alias="node1",fqdn="node1.example",role="hypervisor"}
    values: 1+0x60
  - series: nodectld_vps_boot_autostart_check_last_success_timestamp_seconds{alias="node1",fqdn="node1.example",role="hypervisor"}
    values: 0+60x60
  - series: nodectld_vps_boot_autostart_unsatisfied{alias="node1",fqdn="node1.example",pool="tank",role="hypervisor",vps_id="101"}
    values: 1+0x44 stale _x15
  - series: nodectld_vps_boot_autostart_unsatisfied{alias="node1",fqdn="node1.example",pool="tank",role="hypervisor",vps_id="102"}
    values: _x45 1+0x15
  - series: nodectld_vps_boot_autostart_unsatisfied{alias="node1",fqdn="node1.example",pool="fast",role="hypervisor",vps_id="103"}
    values: 1+0x60
  - series: >-
      nodectld_vps_boot_autostart_unsatisfied_reason{alias="node1",fqdn="node1.example",pool="tank",reason="missing",role="hypervisor",vps_id="101"}
    values: 1+0x34 stale _x25
  - series: >-
      nodectld_vps_boot_autostart_unsatisfied_reason{alias="node1",fqdn="node1.example",pool="tank",reason="not_running",role="hypervisor",vps_id="101"}
    values: _x35 1+0x25
  - series: nodectld_vps_boot_autostart_supported{alias="node1",fqdn="node1.example",role="hypervisor"}
    values: 1+0x60
  - series: nodectld_vps_boot_autostart_state{alias="node1",fqdn="node1.example",role="hypervisor",state="active",reason="none"}
    values: 1+0x60
  alert_rule_test:
  - eval_time: 39m
    alertname: VpsAutostartNotRunning
    exp_alerts: []
  - eval_time: 41m
    alertname: VpsAutostartNotRunning
    exp_alerts:
    - exp_labels:
        alias: node1
        fqdn: node1.example
        frequency: 10m
        pool: tank
        role: hypervisor
        severity: critical
        vps_id: 101
      exp_annotations:
        summary: VPS 101 has an unmet auto-start expectation on node1.example in pool tank
        description: |
          osctld has not observed this VPS running since node boot. Its boot
          auto-start obligation remains pending.
    - exp_labels:
        alias: node1
        fqdn: node1.example
        frequency: 10m
        pool: fast
        role: hypervisor
        severity: critical
        vps_id: 103
      exp_annotations:
        summary: VPS 103 has an unmet auto-start expectation on node1.example in pool fast
        description: |
          osctld has not observed this VPS running since node boot. Its boot
          auto-start obligation remains pending.
  - eval_time: 46m
    alertname: VpsAutostartNotRunning
    exp_alerts:
    - exp_labels:
        alias: node1
        fqdn: node1.example
        frequency: 10m
        pool: fast
        role: hypervisor
        severity: critical
        vps_id: 103
      exp_annotations:
        summary: VPS 103 has an unmet auto-start expectation on node1.example in pool fast
        description: |
          osctld has not observed this VPS running since node boot. Its boot
          auto-start obligation remains pending.
  - eval_time: 54m
    alertname: VpsAutostartNotRunning
    exp_alerts:
    - exp_labels:
        alias: node1
        fqdn: node1.example
        frequency: 10m
        pool: fast
        role: hypervisor
        severity: critical
        vps_id: 103
      exp_annotations:
        summary: VPS 103 has an unmet auto-start expectation on node1.example in pool fast
        description: |
          osctld has not observed this VPS running since node boot. Its boot
          auto-start obligation remains pending.
  - eval_time: 55m
    alertname: VpsAutostartNotRunning
    exp_alerts:
    - exp_labels:
        alias: node1
        fqdn: node1.example
        frequency: 10m
        pool: tank
        role: hypervisor
        severity: critical
        vps_id: 102
      exp_annotations:
        summary: VPS 102 has an unmet auto-start expectation on node1.example in pool tank
        description: |
          osctld has not observed this VPS running since node boot. Its boot
          auto-start obligation remains pending.
    - exp_labels:
        alias: node1
        fqdn: node1.example
        frequency: 10m
        pool: fast
        role: hypervisor
        severity: critical
        vps_id: 103
      exp_annotations:
        summary: VPS 103 has an unmet auto-start expectation on node1.example in pool fast
        description: |
          osctld has not observed this VPS running since node boot. Its boot
          auto-start obligation remains pending.

    values: 1+0x40
  - series: nodectld_vps_boot_autostart_check_success{alias="freshness",fqdn="freshness.example",role="hypervisor"}
    values: 1+0x40
  - series: >-
      nodectld_vps_boot_autostart_check_last_success_timestamp_seconds{alias="freshness",fqdn="freshness.example",role="hypervisor"}
    values: 0+60x10 600+0x29
  - series: >-
      nodectld_vps_boot_autostart_unsatisfied{alias="freshness",fqdn="freshness.example",pool="tank",role="hypervisor",vps_id="401"}
    values: 1+0x40
  alert_rule_test:
  - eval_time: 14m
    alertname: VpsAutostartNotRunning
    exp_alerts:
    - exp_labels:
        alias: freshness
        fqdn: freshness.example
        role: hypervisor
        severity: critical

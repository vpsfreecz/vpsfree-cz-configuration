- name: Boot evidence becomes stale at exactly 300 seconds
  interval: 1m
  input_series:
  - series: node_boot_time_seconds{alias="freshness",fqdn="freshness.example",role="hypervisor"}
    values: "-3600+0x40"
  - series: nodectld_vps_autostart_check_success{alias="freshness",fqdn="freshness.example",role="hypervisor"}
    values: 1+0x40
  - series: >-
      nodectld_vps_autostart_check_last_success_timestamp_seconds{alias="freshness",fqdn="freshness.example",role="hypervisor"}
    values: 0+60x40

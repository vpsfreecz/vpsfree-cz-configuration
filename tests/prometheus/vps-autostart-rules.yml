  alert_rule_test:
  - eval_time: 29m
    alertname: VpsAutostartCheckFailed
    exp_alerts: []
  - eval_time: 39m
    alertname: VpsAutostartCheckFailed
    exp_alerts: []
  - eval_time: 41m
    alertname: VpsAutostartCheckFailed
    exp_alerts:
    - exp_labels:
        alias: failed
        fqdn: failed.example
        frequency: 10m
        role: hypervisor
        severity: warning
      exp_annotations:
        summary: VPS auto-start status check is failing on failed.example
        description: |
          nodectld cannot provide a recent VPS boot auto-start check. Check the
          exported state and reason for missing boot state or an unavailable
          dependency.
    - exp_labels:
        alias: stale

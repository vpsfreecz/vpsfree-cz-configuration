        description: |
          osctld has not observed this VPS running since node boot. Its boot
          auto-start obligation remains pending.
  - eval_time: 15m
    alertname: VpsAutostartNotRunning
    exp_alerts: []
  - eval_time: 24m
    alertname: VpsAutostartCheckFailed
    exp_alerts: []
  - eval_time: 25m
    alertname: VpsAutostartCheckFailed
    exp_alerts:
    - exp_labels:
        alias: freshness
        fqdn: freshness.example
        role: hypervisor
        severity: warning
        frequency: 10m
      exp_annotations:
        summary: VPS auto-start status check is failing on freshness.example
        description: |
          nodectld cannot provide a recent VPS boot auto-start check. Check the
          exported state and reason for missing boot state or an unavailable
          dependency.

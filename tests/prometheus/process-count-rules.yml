rule_files:
  - @ruleFile@

evaluation_interval: 20s

tests:
  - name: Node process warning observes its threshold and hold time
    interval: 20s
    input_series:
      - series: 'node_processes_pids{alias="node-warn",fqdn="node-warn.example",instance="node-warn:9100",job="nodes"}'
        values: '50001+0x15'
    alert_rule_test:
      - eval_time: 4m40s
        alertname: NodeWarnProcessCount
        exp_alerts: []
      - eval_time: 5m
        alertname: NodeWarnProcessCount
        exp_alerts:
          - exp_labels:
              alertclass: processes_total
              alias: node-warn
              fqdn: node-warn.example
              frequency: 15m
              instance: node-warn:9100
              job: nodes
              severity: warning
            exp_annotations:
              summary: Node has too many processes (instance node-warn:9100)
              description: |
                The total host process count is too high. Use osctl_container_processes_pids
                or osctl ct ls -o nproc to identify containers with high task counts.

                VALUE = 50001
                LABELS: map[__name__:node_processes_pids alias:node-warn fqdn:node-warn.example instance:node-warn:9100 job:nodes]

  - name: Node process critical observes its threshold and hold time
    interval: 20s

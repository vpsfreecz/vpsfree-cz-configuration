  - name: Exact thresholds and other jobs do not alert
    interval: 20s
    input_series:
      - series: 'node_processes_pids{instance="node-equal:9100",job="nodes"}'
        values: '50000+0x36'
      - series: 'node_processes_threads{instance="thread-equal:9100",job="nodes"}'
        values: '150000+0x36'
      - series: 'node_processes_pids{instance="infra-equal:9100",job="infra"}'
        values: '2000+0x36'
      - series: 'node_processes_pids{instance="monitor:9100",job="mon"}'
        values: '1000000+0x36'
      - series: 'node_processes_threads{instance="monitor:9100",job="mon"}'
        values: '1000000+0x36'
    alert_rule_test:
      - eval_time: 12m
        alertname: NodeWarnProcessCount
        exp_alerts: []
      - eval_time: 12m
        alertname: NodeCritProcessCount
        exp_alerts: []
      - eval_time: 12m
        alertname: NodeFatalProcessCount
        exp_alerts: []
      - eval_time: 12m
        alertname: NodeWarnThreadCount
        exp_alerts: []
      - eval_time: 12m
        alertname: NodeCritThreadCount
        exp_alerts: []
      - eval_time: 12m
        alertname: NodeFatalThreadCount
        exp_alerts: []
      - eval_time: 12m
        alertname: InfraWarnProcessCount
        exp_alerts: []
      - eval_time: 12m
        alertname: InfraCritProcessCount
